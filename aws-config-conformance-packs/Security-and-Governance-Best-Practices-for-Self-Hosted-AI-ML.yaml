##################################################################################
# Conformance Pack: Self-Hosted AI/ML Security & Governance
# Expected to be deployed in conjunction with AI/ML Security & Governance Supporting Infrastructure best practices conformance pack
#
# Description: This conformance pack provides AWS Managed rules for self-hosted AI workloads.
# Custom Guard DSL rules have been removed.
#
# Total Rules: 122
#
# Coverage:
# - AI Services (Fraud Detector, Kendra): 5 rules (tagging & governance)
# - OpenSearch Domain: 10 rules (search & analytics)
# - OpenSearch Serverless: 1 rule (vector search for RAG)
# - EC2: 40 rules (GPU instances, ASG, launch templates)
# - ALB/NLB: 15 rules (inference API endpoints)
# - API Gateway: 10 rules (model endpoints)
# - ECR: 5 rules (container images)
# - Secrets Manager: 5 rules (API keys & credentials)
# - S3: 14 rules (training data & model storage)
# - ECS: 8 rules (containerized inference)
# - EFS: 4 rules (shared training storage)
# - EKS: 3 rules (Kubernetes ML)
# - EMR: 2 rules (data preprocessing)
#
# IMPORTANT: Rules with Configurable Parameters
# 1. alb-desync-mode-check
#    - desyncMode: "defensive"
#
# 2. desired-instance-type
#    - instanceType: "p3,p4,p5,g4dn,g5,g6,trn1,inf1,inf2"
#
# 3. approved-amis-by-tag
#    - amisByTagKeyAndValue: "Environment:production,Environment:staging,Environment:development"
#
# 4. desired-instance-tenancy
#    - tenancy: "default,dedicated"
#
# 5. api-gw-endpoint-type-check
#    - endpointConfigurationTypes: "PRIVATE,REGIONAL"
#
# 6. secretsmanager-rotation-enabled-check
#    - maximumAllowedRotationFrequency: "2160" (90 days in hours)
#
# 7. eks-cluster-supported-version
#    - oldestVersionSupported: "1.28"
#
# 8. ecs-no-environment-secrets
#    - secretKeys: "password,secret,token,key,api"
#
# 9. kendra-index-tagged
#    - requiredKeyTags: "Environment,OwnerTeam,DataClassification"
##################################################################################

Parameters:
  AlbDesyncMode:
    Type: String
    Default: "defensive"
  AllowedInstanceTypes:
    Type: String
    Default: "p3,p4,p5,g4dn,g5,g6,trn1,inf1,inf2"
  ApprovedAmisByTagKeyAndValue:
    Type: String
    Default: "Environment:production,Environment:staging,Environment:development"
  AllowedInstanceTenancy:
    Type: String
    Default: "default,dedicated"
  ApiGwEndpointConfigurationTypes:
    Type: String
    Default: "PRIVATE,REGIONAL"
  SecretsManagerMaxRotationFrequency:
    Type: String
    Default: "2160"
  OldestEksVersionSupported:
    Type: String
    Default: "1.28"
  EcsSecretKeys:
    Type: String
    Default: "password,secret,token,key,api"
  KendraRequiredTags:
    Type: String
    Default: "Environment,OwnerTeam,DataClassification"

